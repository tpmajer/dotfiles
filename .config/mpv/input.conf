mbtn_left	cycle pause; script-binding uosc/flash-pause-indicator
mbtn_right	script-binding uosc/menu
alt+space	script-binding uosc/menu 

m           no-osd cycle mute; script-binding uosc/flash-volume
up          no-osd add volume  3; script-binding uosc/flash-volume
down        no-osd add volume -3; script-binding uosc/flash-volume
wheel_up	no-osd add volume  2; script-binding uosc/flash-volume
wheel_down	no-osd add volume -2; script-binding uosc/flash-volume 
tab  		script-binding uosc/toggle-ui
#f 			no-osd cycle fs; no-osd cycle-values background-color '#000000' '#1e1e2e'; script-message-to uosc flash-elements top_bar
#u 			no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0; no-osd set panscan 0
b 			no-osd cycle-values background-color '#000000' '#1e1e2e'
ctrl+r		cycle_values video-rotate "90" "180" "270" "0"

#   Example context menu:   
#   This is the default pre-configured menu if none is defined in your `input.conf`, but with added shortcuts. 
#   To both pause & move the window with left mouse button, so that you can have the menu on the right one, 
#   enable `click_threshold` in `uosc.conf` (see default `uosc.conf` for example/docs).  

 o				script-binding uosc/open-file #! Open file
 shift+right	script-binding uosc/next; script-message-to uosc flash-elements top_bar #! Next 
 shift+left		script-binding uosc/prev #! Prev 
 #alt+>       	script-binding uosc/delete-file-next #! Navigation > Delete file & Next 
 #alt+<       	script-binding uosc/delete-file-prev #! Navigation > Delete file & Prev 
 #alt+esc     	script-binding uosc/delete-file-quit #! Navigation > Delete file & Quit 
 s           	script-binding uosc/subtitles #! Subtitles 
 a           	script-binding uosc/audio #! Audio tracks 
# #           	script-binding uosc/stream-quality #! Stream quality 
 p           	script-binding uosc/items #! Playlist 
 c           	script-binding uosc/chapters #! Chapters 
 #           	set video-aspect-override "-1" #! Utils > Aspect ratio > Default 
 #           	set video-aspect-override "16:9" #! Utils > Aspect ratio > 16:9 
 #           	set video-aspect-override "4:3" #! Utils > Aspect ratio > 4:3 
 #           	set video-aspect-override "2.35:1" #! Utils > Aspect ratio > 2.35:1 
 #           	script-binding uosc/audio-device #! Utils > Audio devices 
 #           	script-binding uosc/editions #! Utils > Editions 
 ctrl+s      	async screenshot #! Utils > Screenshot 
 alt+i       	script-binding uosc/keybinds #! Utils > Key bindings 
 d           	script-binding uosc/show-in-directory #! Utils > Show in directory 
 #           	script-binding uosc/open-config-directory #! Utils > Open config directory 
# #           	script-binding uosc/update #! Utils > Update uosc 
 esc         	quit #! Quit 
  
