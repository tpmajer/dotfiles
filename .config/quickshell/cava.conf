# The bar's wave: services/Spectrum.qml reads 15 bars a frame from
# stdout, as "12;40;7;0;3;" with 100 the highest.

[general]
framerate = 20
bars = 15
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 77
