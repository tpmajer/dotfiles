general {
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock  # Quickshell's lock; hyprlock if Quickshell does not answer.
    before_sleep_cmd = ~/.config/quickshell/scripts/lock-before-sleep.sh; systemctl --user stop idle-inhibit.service 2>/dev/null  # lock at once and wait for it, drop the bar's idle inhibitor.
    after_sleep_cmd = niri msg output eDP-1 on && sleep 1 && brightnessctl -r  # to avoid having to press a key twice to turn on the display.
	inhibit_sleep = 1  # delay the suspend until before_sleep_cmd is done; 3 (wait for the lock) needs a protocol niri lacks.
}

listener {
	timeout = 30
	on-timeout = notify-send -u low 'System is idle'
	on-resume = notify-send -u low 'System is no longer idle'
}

# Dim the screen
listener {
    timeout = 120                                # 2 min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# Turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 120                                                 # 2 min
    on-timeout = brightnessctl -sd chromeos::kbd_backlight set 0  # turn off keyboard backlight.
    on-resume = brightnessctl -rd chromeos::kbd_backlight         # turn on keyboard backlight.
}

# Lock the screen
listener {
    timeout = 180                                 # 3 min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
	on-resume = brightnessctl -r
}

# Turn off screen
listener {
    timeout = 210                                                     # 3.5 min
    on-timeout = niri msg output eDP-1 off                            # screen off when timeout has passed
    on-resume = niri msg output eDP-1 on && sleep 1 && brightnessctl -r  # screen on, then restore brightness after display is ready.
}

# Suspend the system
listener {
    timeout = 600                                # 10 min
    on-timeout = systemctl suspend               # suspend pc
	on-resume = nmcli device wifi rescan
}
