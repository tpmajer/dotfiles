general {
    lock_cmd = qs ipc call lock lock  # Quickshell's lock.
    before_sleep_cmd = ~/.config/quickshell/scripts/lock-before-sleep.sh; systemctl --user stop idle-inhibit.service 2>/dev/null  # lock at once and wait for it, drop the bar's idle inhibitor.
    after_sleep_cmd = qs ipc call lock woke; systemctl --user --no-block try-restart thunderbird-headless.service 2>/dev/null; niri msg action power-on-monitors && sleep 1 && brightnessctl -r  # the lock's reader anew; Thunderbird anew, or mail waits up to 10 min for its next check (a no-op with its window up); to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 1  # delay the suspend until before_sleep_cmd is done; 3 (wait for the lock) needs a protocol niri lacks.
}

listener {
    timeout = 30
    on-timeout = notify-send -u low 'System is idle'            # low: a toast only, not kept in the notification center.
    on-resume = notify-send -u low 'System is no longer idle'
}

# Dim the screen
listener {
    timeout = 120                                # 2 min.
    on-timeout = ~/.config/quickshell/scripts/idle-dim.sh dim      # fade the monitor backlight to its minimum.
    on-resume = ~/.config/quickshell/scripts/idle-dim.sh restore   # stop the fade, fade the monitor backlight back.
}

# Turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 120                                                 # 2 min
    on-timeout = brightnessctl -sd chromeos::kbd_backlight set 0  # turn off keyboard backlight.
    on-resume = brightnessctl -rd chromeos::kbd_backlight         # turn on keyboard backlight.
}

# Lock the screen
listener {
    timeout = 180                                 # 3 min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed; the dimming's on-resume restores the backlight.
}

# Turn off screen
listener {
    timeout = 210                                                     # 3.5 min
    on-timeout = niri msg action power-off-monitors                   # screens off when timeout has passed; the outputs stay, unlike with `niri msg output … off`.
    on-resume = niri msg action power-on-monitors && sleep 1 && brightnessctl -r  # screens on, then restore brightness after display is ready.
}

# Suspend the system
listener {
    timeout = 600                                # 10 min
    on-timeout = systemctl suspend               # suspend pc
    on-resume = nmcli device wifi rescan
}
